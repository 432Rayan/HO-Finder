<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<!-- Don't you all feel I deserve 200K? Right? -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HO Finder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eaf1f7; color: #1f2a26; line-height: 1.6;
    display: flex; justify-content: center; padding: 20px 14px;
    min-height: 100vh;
  }
  .card {
    background: #fff; width: 100%; max-width: 460px; align-self: flex-start;
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(60, 100, 140, .12);
  }
  .hero {
    background: linear-gradient(135deg, #e8f2fb 0%, #c9e0f4 100%);
    color: #27435c; padding: 30px 24px 26px;
  }
  .hero h1 { font-size: 1.6rem; letter-spacing: .2px; display: flex; align-items: center; gap: 10px; }
  .hero h1 svg { flex: none; }
  .hero p { margin-top: 8px; font-size: .95rem; color: #4d6a86; }
  .body { padding: 22px 22px 26px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: 1.2px; color: #6b8199; margin-bottom: 12px; }
  .btn {
    display: inline-block; border: none; cursor: pointer; text-decoration: none;
    border-radius: 12px; padding: 13px 20px; font-size: 1rem; font-weight: 600;
    font-family: inherit; white-space: nowrap; transition: filter .15s;
  }
  .btn:active { filter: brightness(.92); }
  .btn-primary { background: #4a7bab; color: #fff; width: 100%; margin-bottom: 14px;
    box-shadow: 0 4px 12px rgba(74, 123, 171, .30); }
  .btn-primary:disabled { background: #a9bfd2; box-shadow: none; cursor: default; }
  .btn-secondary { background: #fff; color: #4a7bab; border: 1.5px solid #4a7bab; }
  .row { display: flex; gap: 8px; }
  .row input {
    flex: 1; min-width: 0; border: 1.5px solid #d3e0ea; border-radius: 12px; padding: 12px 14px;
    font-size: 1rem; font-family: inherit; background: #fbfdfe;
  }
  .row input:focus { outline: 2px solid #4a7bab44; border-color: #4a7bab; }
  .row .btn { padding: 12px 16px; }
  label.hint { display: block; font-size: .85rem; color: #6b8199; margin-bottom: 6px; }
  .callout { border-radius: 12px; padding: 12px 14px; margin-top: 16px; font-size: .9rem; }
  .callout.warn { background: #fdf3e7; border-left: 3px solid #c98a2d; }
  .callout.note { background: #e9f2fa; border-left: 3px solid #4a7bab; color: #33506b; }
  .callout b { display: block; margin-bottom: 2px; }
  .result { margin-top: 24px; border-top: 1px solid #e2ecf3; padding-top: 20px; }
  .office-name { font-size: 1.35rem; font-weight: 700; color: #27435c; }
  .office-area { color: #6b8199; font-size: .9rem; margin: 2px 0 14px; }
  .pill {
    display: inline-block; background: #dcebf8; color: #27435c; font-weight: 700;
    border-radius: 999px; padding: 4px 12px; font-size: .85rem; margin-bottom: 14px;
  }
  table.facts { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  table.facts td { padding: 11px 4px; border-bottom: 1px solid #e7eff5; font-size: .95rem; }
  table.facts td:first-child { color: #6b8199; }
  table.facts td:last-child { font-weight: 600; text-align: right; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .actions .btn { width: 100%; text-align: center; margin-bottom: 0; }
  .next { margin-top: 16px; font-size: .88rem; color: #4d6478; }
  .sig { text-align: center; margin-top: 22px; font-size: .68rem; color: #aec2d1; letter-spacing: .4px; }
</style>
</head>
<body>
<div class="card">
  <div class="hero">
    <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="#27435c"/></svg>HO Finder</h1>
    <p>Share your location or paste a Google Maps link, and get the nearest HO with its POC, phone and commission.</p>
  </div>
  <div class="body">
    <h2>Your location</h2>
    <button id="geoBtn" class="btn btn-primary" type="button">Use my current location</button>
    <label class="hint" for="linkInput">Or paste a Google Maps link (or type coordinates)</label>
    <div class="row">
      <input id="linkInput" type="text" inputmode="text" placeholder="30.0444, 31.2357">
      <button id="goBtn" class="btn btn-secondary" type="button">Find HO</button>
    </div>

    <div id="errorBox" class="callout warn" style="display:none"><b id="errorTitle"></b><span id="errorMsg"></span></div>

    <div id="resultBox" class="result" style="display:none">
      <h2>Nearest HO</h2>
      <p class="office-name" id="officeName"></p>
      <p class="office-area" id="officeArea"></p>
      <span class="pill" id="distPill"></span>
      <table class="facts"><tbody id="factsBody"></tbody></table>
      <div class="actions">
        <a id="callBtn" class="btn btn-secondary" href="#">Call the POC</a>
        <a id="waBtn" class="btn btn-primary" href="#" target="_blank" rel="noopener">WhatsApp the POC</a>
        <a id="mapBtn" class="btn btn-secondary" href="#" target="_blank" rel="noopener">Open HO on the map</a>
      </div>
      <p class="next" id="nextLine"></p>
    </div>
    <p class="sig">Rayan</p>
  </div>
</div>

function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function parseCoords(text) {
  const t = text.trim();
  let m = t.match(/!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = t.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = t.match(/[?&]q=(-?\d+\.?\d*)[,+%2C]+(-?\d+\.?\d*)/i);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = t.match(/[?&]ll=(-?\d+\.?\d*)[,+%2C]+(-?\d+\.?\d*)/i);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = t.match(/^(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)$/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  return null;
}

function kmLabel(km) {
  if (km < 1) return Math.round(km * 1000) + " m";
  return km.toFixed(1) + " km";
}

const geoBtn = document.getElementById('geoBtn');
const goBtn = document.getElementById('goBtn');
const linkInput = document.getElementById('linkInput');
const errorBox = document.getElementById('errorBox');
const errorTitle = document.getElementById('errorTitle');
const errorMsg = document.getElementById('errorMsg');
const resultBox = document.getElementById('resultBox');

function showError(title, msg) {
  errorTitle.textContent = title;
  errorMsg.textContent = msg;
  errorBox.style.display = 'block';
}

function locate(pos) {
  const ranked = OFFICES
    .map(o => ({ o, km: haversineKm(pos, o) }))
    .sort((a, b) => a.km - b.km)
    .slice(0, 3);
  const best = ranked[0];
  errorBox.style.display = 'none';
  document.getElementById('officeName').textContent = best.o.name;
  document.getElementById('officeArea').textContent = best.o.zone + " · " + best.o.nb;
  document.getElementById('distPill').textContent = "About " + kmLabel(best.km) + " away";
  const facts = [
    ['POC Name', best.o.worker || 'Unknown'],
    ['Phone', best.o.phone || 'Unknown'],
    ['Commission', best.o.comm === null ? 'Unknown' : best.o.comm + ' EGP'],
    ['First Degree Needed?', best.o.fam === 'Yes' ? 'Yes' : (best.o.fam === 'No' ? 'No' : 'Unknown')],
  ];
  document.getElementById('factsBody').innerHTML = facts.map(f =>
    '<tr><td>' + f[0] + '</td><td>' + f[1] + '</td></tr>').join('');
  const callBtn = document.getElementById('callBtn');
  if (best.o.phone) { callBtn.href = 'tel:+2' + best.o.phone; callBtn.style.display = ''; }
  else callBtn.style.display = 'none';
  const waBtn = document.getElementById('waBtn');
  if (best.o.phone) { waBtn.href = 'https://wa.me/2' + best.o.phone; waBtn.style.display = ''; }
  else waBtn.style.display = 'none';
  const mapBtn = document.getElementById('mapBtn');
  if (best.o.map) { mapBtn.href = best.o.map; mapBtn.style.display = ''; }
  else mapBtn.style.display = 'none';
  let next = '';
  if (ranked.length > 1) {
    next = 'Next nearest HOs: ' + ranked[1].o.name + ' (' + kmLabel(ranked[1].km) + ')';
    if (ranked[2]) next += ', then ' + ranked[2].o.name + ' (' + kmLabel(ranked[2].km) + ')';
    next += '.';
  }
  document.getElementById('nextLine').textContent = next;
  resultBox.style.display = 'block';
  resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

geoBtn.addEventListener('click', () => {
  if (!('geolocation' in navigator)) {
    showError('Location unavailable', "This browser doesn't support location. Paste a Google Maps link below.");
    return;
  }
  geoBtn.disabled = true;
  geoBtn.textContent = 'Locating...';
  navigator.geolocation.getCurrentPosition(
    p => { geoBtn.disabled = false; geoBtn.textContent = 'Use my current location'; locate({ lat: p.coords.latitude, lng: p.coords.longitude }); },
    () => {
      geoBtn.disabled = false; geoBtn.textContent = 'Use my current location';
      showError('Location unavailable', 'The browser refused to share your location. Open the place in Google Maps and paste the link below instead.');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

goBtn.addEventListener('click', () => {
  const coords = parseCoords(linkInput.value);
  if (!coords) {
    showError("Can't read that link", "I couldn't find coordinates in this link. If it's a short link (maps.app.goo.gl), open it in the browser first and copy the full link, or type coordinates like 30.0444, 31.2357.");
    return;
  }
  locate(coords);
});
linkInput.addEventListener('keydown', e => { if (e.key === 'Enter') goBtn.click(); });
</script>
