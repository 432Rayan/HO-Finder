  .toggleWrapper { overflow: hidden; line-height: 0; width: 56px; height: 31px; }
  .toggleWrapper input { position: absolute; left: -99em; }
  .toggle { transform: scale(.62); transform-origin: top left; cursor: pointer; display: inline-block; position: relative; width: 90px; height: 50px; background-color: #83D8FF; border-radius: 84px; transition: background-color 200ms cubic-bezier(0.445, 0.05, 0.55, 0.95); }
  .toggle__handler { display: inline-block; position: relative; z-index: 1; top: 3px; left: 3px; width: 44px; height: 44px; background-color: #FFCF96; border-radius: 50px; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: all 400ms cubic-bezier(0.68, -0.55, 0.265, 1.55); transform: rotate(-45deg); }
  .crater { position: absolute; background-color: #E8CDA5; opacity: 0; transition: opacity 200ms ease-in-out; border-radius: 100%; }
  .crater--1 { top: 18px; left: 10px; width: 4px; height: 4px; }
  .crater--2 { top: 28px; left: 22px; width: 6px; height: 6px; }
  .crater--3 { top: 10px; left: 25px; width: 8px; height: 8px; }
  .star { position: absolute; background-color: #fff; transition: all 300ms cubic-bezier(0.445, 0.05, 0.55, 0.95); border-radius: 50%; }
  .star--1 { top: 10px; left: 35px; z-index: 0; width: 30px; height: 3px; }
  .star--2 { top: 18px; left: 28px; z-index: 1; width: 30px; height: 3px; }
  .star--3 { top: 27px; left: 40px; z-index: 0; width: 30px; height: 3px; }
  .star--4, .star--5, .star--6 { opacity: 0; transition: all 300ms 0s cubic-bezier(0.445, 0.05, 0.55, 0.95); }
  .star--4 { top: 16px; left: 11px; z-index: 0; width: 2px; height: 2px; transform: translate3d(3px,0,0); }
  .star--5 { top: 32px; left: 17px; z-index: 0; width: 3px; height: 3px; transform: translate3d(3px,0,0); }
  .star--6 { top: 36px; left: 28px; z-index: 0; width: 2px; height: 2px; transform: translate3d(3px,0,0); }
  input:checked + .toggle { background-color: #749DD6; }
  input:checked + .toggle .toggle__handler { background-color: #FFE5B5; transform: translate3d(40px,0,0) rotate(0); }
  input:checked + .toggle .crater { opacity: 1; }
  input:checked + .toggle .star--1 { width: 2px; height: 2px; }
  input:checked + .toggle .star--2 { width: 4px; height: 4px; transform: translate3d(-5px,0,0); }
  input:checked + .toggle .star--3 { width: 2px; height: 2px; transform: translate3d(-7px,0,0); }
  input:checked + .toggle .star--4, input:checked + .toggle .star--5, input:checked + .toggle .star--6 { opacity: 1; transform: translate3d(0,0,0); }
  input:checked + .toggle .star--4 { transition: all 300ms 200ms cubic-bezier(0.445, 0.05, 0.55, 0.95); }
  input:checked + .toggle .star--5 { transition: all 300ms 300ms cubic-bezier(0.445, 0.05, 0.55, 0.95); }
  input:checked + .toggle .star--6 { transition: all 300ms 400ms cubic-bezier(0.445, 0.05, 0.55, 0.95); }
  .tools { align-items: center; }

  #geoBtn { display: none !important; }
  .slide { position: relative; height: 60px; border-radius: 999px; margin-bottom: 14px; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: pan-y;
    background: linear-gradient(135deg, #e3eefa, #cfe1f4); border: 1px solid rgba(74,123,171,.35); box-shadow: inset 0 2px 6px rgba(58,98,140,.15); }
  .slide, .slide * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .slide ::selection { background: transparent; }
  .slide .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, #8db5dc, #4a7bab); }
  .slide .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-left: 40px; font-weight: 600; font-size: .95rem; color: #3a628c; letter-spacing: .3px; pointer-events: none; }
  .slide .lbl span { background: linear-gradient(100deg, #3a628c 35%, #9fc3e6 50%, #3a628c 65%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: slShimmer 2.8s linear infinite; }
  @keyframes slShimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .slide .handle { position: absolute; left: 4px; top: 4px; width: 50px; height: 50px; border-radius: 50%; background: #fff; color: #4a7bab; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none;
    box-shadow: 0 4px 12px rgba(58,98,140,.35); z-index: 2; }
  .slide .handle:active { cursor: grabbing; }
  .slide .handle svg { display: block; }
  .slide.snap .handle, .slide.snap .fill, .slide.snap .lbl { transition: transform .35s cubic-bezier(.34,1.4,.64,1), width .35s cubic-bezier(.34,1.4,.64,1), opacity .25s; }
  .slide.busy .lbl span { animation: none; background: none; color: #fff; -webkit-text-fill-color: #fff; }
  .slide.busy .handle { animation: slPulse 1.2s ease-in-out infinite; }
  @keyframes slPulse { 50% { box-shadow: 0 4px 12px rgba(58,98,140,.35), 0 0 0 9px rgba(255,255,255,.28); } }
  body.dark .slide { background: linear-gradient(135deg, #1b2c3e, #16283a); border-color: rgba(143,192,238,.3); box-shadow: inset 0 2px 8px rgba(0,0,0,.4); }
  body.dark .slide .fill { background: linear-gradient(90deg, #2f5c87, #4a8bc4); }

function norm(s) {
  return (s || '').toString().toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/[^a-z0-9\u0600-\u06FF\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function zoneLabel(z) { return z; }

function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function parseCoords(text) {
  const tx = text.trim();
  let m = tx.match(/!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = tx.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = tx.match(/[?&]q=(-?\d+\.?\d*)[,+%2C]+(-?\d+\.?\d*)/i);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = tx.match(/[?&]ll=(-?\d+\.?\d*)[,+%2C]+(-?\d+\.?\d*)/i);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = tx.match(/^(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)$/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  return null;
}

function kmLabel(km) {
  if (km < 1) return Math.round(km * 1000) + " m";
  return km.toFixed(1) + " km";
}

function renderList() {
  const q = norm(searchInput.value);

  });
  if (!items.length) { officeList.innerHTML = '<div class="empty">' + t('noMatch') + '</div>'; return; }
  let html = '', lastZone = null;
  items.forEach(o => {
    if (o.zone !== lastZone) { html += '<div class="zh">' + zoneLabel(o.zone) + '</div>'; lastZone = o.zone; }
    html += '<button type="button" class="item' + (o.name === selectedName ? ' sel' : '') + '" data-n="' + OFFICES.indexOf(o) + '">' +
      escapeHtml(dName(o)) + '<small>' + escapeHtml(dArea(o)) + '</small></button>';
  });
  officeList.innerHTML = html;
}

}

function inPoly(p, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const yi = poly[i][0], xi = poly[i][1], yj = poly[j][0], xj = poly[j][1];
    if ((yi > p.lat) !== (yj > p.lat) && p.lng < (xj - xi) * (p.lat - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}

function locate(pos) {
  let ranked = OFFICES
    .map(o => ({ o, km: haversineKm(pos, o) }))
    .sort((a, b) => a.km - b.km);
  let hospNote = '';
  let near = null;
  HOSPITALS.forEach(h => { const d = haversineKm(pos, h); if (d <= HOSPITAL_RADIUS_KM && (!near || d < near.d)) near = { h: h, d: d }; });
  if (near) {
    const own = near.h.o.map(n => ranked.find(r => r.o.name === n)).filter(Boolean);
    if (own.length) {
      const first = ranked[0];
      hospNote = "You're at " + near.h.n + '. This hospital belongs to ' + own[0].o.name;
      hospNote += first === own[0] ? '.' : ', even though ' + first.o.name + ' is closer (' + kmLabel(first.km) + ' away).';
      ranked = own.concat(ranked.filter(r => own.indexOf(r) === -1));
    }
  }
  if (!near) {
    const ar = AREAS.find(a => a.polys.some(r => inPoly(pos, r)));
    if (ar) {
      const own = ar.o.map(n => ranked.find(r => r.o.name === n)).filter(Boolean);
      if (own.length) {
        const first = ranked[0];
        hospNote = ar.n + ' belongs to ' + own[0].o.name;
        hospNote += first === own[0] ? '.' : ', even though ' + first.o.name + ' is closer (' + kmLabel(first.km) + ' away).';
        ranked = own.concat(ranked.filter(r => own.indexOf(r) === -1));
      }
    }
  }
  ranked = ranked.slice(0, 3);
  errorBox.style.display = 'none';
  selectedName = ranked[0].o.name;
  lastView = { o: ranked[0].o, km: ranked[0].km, ranked: ranked, hospNote: hospNote };
  renderOffice(lastView);
  renderList();
  resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

    () => { geoBtn.disabled = false; setGeo(t('geo')); showError(t('errRef'), t('errRefMsg')); },

const RESOLVER = 'https://script.google.com/macros/s/AKfycbywGfAyEc2Qjh21i0z67ckzOsSlhtMZMCcRYPhN-qCDQw1nWa7Ilx4aPtdlK2yqwfOl/exec';

goBtn.addEventListener('click', async () => {
  const text = linkInput.value.trim();
  const coords = parseCoords(text);
  if (coords) { locate(coords); return; }
  if (/^(https?:\/\/)?[^\s]*(goo\.gl|google\.[a-z.]+)\//i.test(text)) {
    goBtn.disabled = true; goBtn.textContent = t('reading');
    errorBox.style.display = 'none';
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 20000);
      const r = await fetch(RESOLVER + '?url=' + encodeURIComponent(text), { signal: ctl.signal });
      clearTimeout(timer);
      const d = await r.json();
      if (d && d.ok && isFinite(d.lat) && isFinite(d.lng)) {
        goBtn.disabled = false; goBtn.textContent = t('find');
        locate({ lat: d.lat, lng: d.lng });
        return;
      }
    } catch (e) { /* fall through */ }
    goBtn.disabled = false; goBtn.textContent = t('find');
    const norm = u => String(u || '').trim().toLowerCase().replace(/^https?:\/\//, '').split('?')[0].replace(/\/+$/, '');
    const known = OFFICES.find(o => o.map && o.lat != null && norm(o.map) === norm(text));
    if (known) { locate({ lat: known.lat, lng: known.lng }); return; }
    showError(t('errLink'), t('errLinkMsg'));
    return;
  }
  showError(t('errRead'), t('errReadMsg'));
});

(function () {
  const slide = document.getElementById('slide'), hd = document.getElementById('slHandle'), fill = document.getElementById('slFill'), lbl = slide.querySelector('.lbl');
  let drag = false, sx = 0, x = 0, max = 0;
  const set = v => { x = Math.max(0, Math.min(max, v)); hd.style.transform = 'translateX(' + x + 'px)'; fill.style.width = (x + 54) + 'px'; lbl.style.opacity = Math.max(0, 1 - (x / max) * 1.6); };
  const reset = () => { slide.classList.add('snap'); slide.classList.remove('busy'); max = slide.clientWidth - 58; set(0); lbl.style.opacity = 1; fill.style.width = '0px'; };
  function done() {
    max = slide.clientWidth - 58; slide.classList.add('snap'); set(max); slide.classList.add('busy'); lbl.style.opacity = 1; fill.style.width = '100%';
    if (!geoBtn.disabled) geoBtn.click();
  }
  hd.addEventListener('pointerdown', e => { e.preventDefault(); if (slide.classList.contains('busy')) return; drag = true; max = slide.clientWidth - 58; sx = e.clientX - x; slide.classList.remove('snap'); hd.setPointerCapture(e.pointerId); });
  hd.addEventListener('pointermove', e => { if (drag) set(e.clientX - sx); });
  const end = () => { if (!drag) return; drag = false; if (x >= max * 0.85) done(); else reset(); };
  hd.addEventListener('pointerup', end); hd.addEventListener('pointercancel', end);
  hd.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!slide.classList.contains('busy')) done(); } });
  new MutationObserver(() => { if (!geoBtn.disabled && slide.classList.contains('busy')) setTimeout(reset, 400); }).observe(geoBtn, { attributes: true, attributeFilter: ['disabled'] });
  window.addEventListener('resize', () => { if (!drag && !slide.classList.contains('busy')) { max = slide.clientWidth - 58; set(0); } });
})();
